# Alembic config. Paths are relative to this file (%(here)s), so `alembic -c <path>` and
# alembic.command.upgrade(Config(<path>)) work from any working directory: the repo root
# locally, /app in the image.
#
# sqlalchemy.url is deliberately absent: callers set it on the Config, otherwise
# migrations/env.py falls back to TX_DATABASE_URL via transcription.config.

[alembic]
script_location = %(here)s/migrations
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
