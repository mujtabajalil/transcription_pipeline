[project]
name = "transcription"
version = "0.1.0"
description = "Async speech-to-text service: VAD-chunked Whisper behind a durable job queue."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "boto3>=1.34",
    "fastapi>=0.115",
    "faster-whisper>=1.1",
    "httpx>=0.27",
    "numpy>=1.26",
    "prometheus-client>=0.20",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "sqlalchemy>=2.0.30",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
transcribe = "transcription.cli:main"
tx-worker = "transcription.worker.main:main"
tx-admin = "transcription.admin:main"

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.34",
    "jiwer>=3.0",
    "moto[s3,server]>=5.0",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transcription"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S", "PTH", "RET", "TID"]
ignore = [
    "S101",   # assert is fine in tests
    "S603",   # subprocess with validated, list-form args is the point of audio/
    "S607",   # ffmpeg/ffprobe resolved from PATH by design
    "RUF012", # pydantic/sqlalchemy class attrs
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PTH"]
"eval/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "ctranslate2.*", "jiwer.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not integration and not e2e'"
timeout = 300
markers = [
    "integration: needs Postgres/Redis/MinIO from docker compose (make infra)",
    "e2e: full stack incl. a real Whisper model (make e2e)",
    "slow: loads a Whisper model",
]
filterwarnings = ["error::DeprecationWarning:transcription.*"]
